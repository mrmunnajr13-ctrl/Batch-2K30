<script>
/* =========================================================

   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCXWHpNMdzh_eNaf-FT1JOIzrWB-m3W3LE",
  authDomain: "batch-2k30-8b383.firebaseapp.com",
  projectId: "batch-2k30-8b383",
  storageBucket: "batch-2k30-8b383.firebasestorage.app",
  messagingSenderId: "483991582927",
  appId: "1:483991582927:web:eae45a9e12cf7c67ca1fba"
};

const IMGBB_API_KEY = "673803738f3dafb65b35ea966c9327a5";

firebase.initializeApp(firebaseConfig);
const auth    = firebase.auth();
const db      = firebase.firestore();
const FV      = firebase.firestore.FieldValue;

/* =========================================================
   ONESIGNAL CONFIGURATION (এখানে আপনার কোড বসান)
   ========================================================= */
const ONESIGNAL_APP_ID = "a6ea84be-f6f7-457c-9def-85da02a4fa65"; 
const ONESIGNAL_REST_KEY = "os_v2_app_u3vijpxw65cxzhppqxnafjh2mvje2e74u5jumnevuwbcbhg64zs4smkulhzuwgqxlagg4slnj4prehgk3vap5mtue2k5g6ndvh6i6oa"; 

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {

    appId: ONESIGNAL_APP_ID,
    notifyButton: { enable: false },
    allowLocalhostAsSecureOrigin: true,

});


/* =========================================================
   2) STATE & HELPERS
   ========================================================= */
let fbUser = null, myProfile = null, allUsers = [], isSignup = false;
let pendingPhoto = null, returnScreen = 'appScreen';
let unsubUsers = null, unsubMessages = null, unsubMe = null;
let authReady = false, splashReady = false, started = false;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active'); s.style.display = 'none';
  });
  const el = document.getElementById(id);
  if(el){ el.style.display = 'flex'; el.classList.add('active'); }
}
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.opacity = '0'; }, 2600);
}
function esc(s=''){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function avatarOf(u){ return (u && u.photo) ? u.photo : `https://ui-avatars.com/api/?background=6366f1&color=fff&name=${encodeURIComponent((u&&u.name)||'U')}`; }
function fmtTime(ts){ if(!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function isOnline(u){ if(!u || !u.lastSeen) return false; const ms = u.lastSeen.toMillis ? u.lastSeen.toMillis() : new Date(u.lastSeen).getTime(); return (Date.now() - ms) < 70000; }
function openModal(html){ document.getElementById('modalBody').innerHTML = html; const m = document.getElementById('modal'); m.classList.remove('hidden'); m.classList.add('flex'); }
function closeModal(){ const m = document.getElementById('modal'); m.classList.add('hidden'); m.classList.remove('flex'); }
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id === 'modal') closeModal(); });

function fileToDataURL(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function compress(file, max=1000, q=0.82){ const dataUrl = await fileToDataURL(file); return new Promise(res=>{ const img = new Image(); img.onload = ()=>{ let w = img.width, h = img.height; if(w > max || h > max){ const s = Math.min(max/w, max/h); w = Math.round(w*s); h = Math.round(h*s); } const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); res(c.toDataURL('image/jpeg', q)); }; img.onerror = ()=>res(dataUrl); img.src = dataUrl; }); }
async function uploadImage(file){ const dataUrl = await compress(file, 1000, 0.82); if(!IMGBB_API_KEY || IMGBB_API_KEY.indexOf('PASTE_') === 0){ return dataUrl; } try{ const fd = new FormData(); fd.append('image', dataUrl.split(',')[1]); const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {method:'POST', body:fd}); const j = await r.json(); if(j && j.success) return j.data.url; }catch(e){ console.warn('imgbb failed', e); } return dataUrl; }

/* Splash */
(function splashTyping(){ const text = 'Welcome to batch 2K30'; const el = document.getElementById('splashText'); let i = 0; (function step(){ if(i < text.length){ el.textContent += text[i++]; setTimeout(step, 70); } else { setTimeout(()=>{ splashReady = true; tryRoute(); }, 900); } })(); })();
function tryRoute(){ if(!authReady || !splashReady) return; route(); }

/* Auth */
auth.onAuthStateChanged(user=>{ fbUser = user; authReady = true; tryRoute(); });
document.getElementById('authToggle').addEventListener('click', ()=>{ isSignup = !isSignup; document.getElementById('authBtn').textContent = isSignup ? 'Sign Up' : 'Login'; document.getElementById('authSubtitle').textContent = isSignup ? 'Create a new account' : 'Login to continue'; document.getElementById('authToggleText').textContent = isSignup ? 'Already have an account?' : "Don't have an account?"; document.getElementById('authToggle').textContent = isSignup ? 'Login' : 'Sign Up'; });
document.getElementById('authBtn').addEventListener('click', async ()=>{ const email = document.getElementById('authEmail').value.trim(); const pass = document.getElementById('authPass').value; if(!email || !pass) return toast('ইমেইল ও পাসওয়ার্ড দিন'); if(pass.length < 6) return toast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর'); const btn = document.getElementById('authBtn'); btn.disabled = true; btn.textContent = 'Please wait...'; try{ if(isSignup){ await auth.createUserWithEmailAndPassword(email, pass); }else{ await auth.signInWithEmailAndPassword(email, pass); } }catch(e){ toast(e.message.replace('Firebase: ','')); }finally{ btn.disabled = false; btn.textContent = isSignup ? 'Sign Up' : 'Login'; } });
async function route(){ if(started) return; if(!fbUser){ showScreen('authScreen'); return; } try{ const snap = await db.collection('users').doc(fbUser.uid).get(); if(!snap.exists){ showScreen('setupScreen'); return; } const p = snap.data(); if(p.banned){ await auth.signOut(); showScreen('authScreen'); toast('আপনার একাউন্টটি ব্যান করা হয়েছে।'); return; } myProfile = p; startApp(); }catch(e){ console.error(e); showScreen('authScreen'); toast('সংযোগে সমস্যা হয়েছে'); } }

/* Setup */
document.getElementById('setupPhoto').addEventListener('change', async e=>{ const f = e.target.files[0]; if(!f) return; const preview = document.getElementById('setupPreview'); const local = await fileToDataURL(f); preview.src = local; pendingPhoto = await compress(f, 400, 0.85); });
document.getElementById('setupName').addEventListener('input', e=>{ if(!pendingPhoto){ document.getElementById('setupPreview').src = `https://ui-avatars.com/api/?background=6366f1&color=fff&name=${encodeURIComponent(e.target.value || 'U')}`; } });
document.getElementById('createAccountBtn').addEventListener('click', async ()=>{ const name = document.getElementById('setupName').value.trim(); if(!name) return toast('আপনার নাম লিখুন'); if(!fbUser) return toast('আবার লগইন করুন'); const btn = document.getElementById('createAccountBtn'); btn.disabled = true; btn.textContent = 'Creating...'; try{ let photo = `https://ui-avatars.com/api/?background=6366f1&color=fff&name=${encodeURIComponent(name)}`; if(pendingPhoto){ const blob = await (await fetch(pendingPhoto)).blob(); const file = new File([blob], 'avatar.jpg', {type:'image/jpeg'}); photo = await uploadImage(file); } await db.collection('users').doc(fbUser.uid).set({ uid: fbUser.uid, name, email: fbUser.email || '', photo, banned: false, online: true, createdAt: FV.serverTimestamp(), lastSeen: FV.serverTimestamp() }); myProfile = {uid: fbUser.uid, name, email: fbUser.email, photo, banned:false}; startApp(); }catch(e){ console.error(e); toast('একাউন্ট তৈরি ব্যর্থ: ' + e.message); }finally{ btn.disabled = false; btn.textContent = 'Account Create'; } });

/* Start App */
function startApp(){ started = true; showScreen('appScreen'); refreshHeader(); heartbeat(); if(window.__hb) clearInterval(window.__hb); window.__hb = setInterval(heartbeat, 25000); if(unsubMe) unsubMe(); unsubMe = db.collection('users').doc(fbUser.uid).onSnapshot(s=>{ if(!s.exists) return; const d = s.data(); if(d.banned){ auth.signOut(); location.reload(); return; } myProfile = d; refreshHeader(); }); if(unsubUsers) unsubUsers(); unsubUsers = db.collection('users').onSnapshot(snap=>{ allUsers = snap.docs.map(d=>({id:d.id, ...d.data()})); document.getElementById('memberCount').textContent = allUsers.length; document.getElementById('chatOnlineCount').textContent = allUsers.filter(isOnline).length; }); db.collection('messages').orderBy('createdAt','desc').limit(1).onSnapshot(s=>{ if(s.empty) return; const m = s.docs[0].data(); const pv = document.getElementById('lastMsgPreview'); if(!pv) return; pv.textContent = (m.name || '') + ': ' + (m.type === 'text' ? m.text : m.type === 'image' ? '📷 Photo' : '🎤 Voice message'); }); }
function refreshHeader(){ if(!myProfile) return; document.getElementById('headerAvatar').src = avatarOf(myProfile); document.getElementById('profileAvatar').src = avatarOf(myProfile); document.getElementById('profileName').textContent = myProfile.name || '—'; document.getElementById('profileEmail').textContent = myProfile.email || '—'; document.getElementById('profileUid').textContent = 'UID: ' + (myProfile.uid || ''); }
async function heartbeat(){ if(!fbUser) return; try{ await db.collection('users').doc(fbUser.uid).update({ online: true, lastSeen: FV.serverTimestamp() }); }catch(e){} }

/* Nav & Profile */

function openProfile(){ refreshHeader(); showScreen('profileScreen'); }

async function logout(){ try{ if(fbUser) await db.collection('users').doc(fbUser.uid).update({online:false}); }catch(e){} await auth.signOut(); location.reload(); }
function applyTheme(theme){ localStorage.setItem('b2k_theme', theme); const dark = theme === 'dark'; document.documentElement.classList.toggle('dark', dark); document.body.classList.toggle('dark', dark); }
applyTheme(localStorage.getItem('b2k_theme') || 'default');

/* =========================================================
   3) CHAT & MESSENGER-STYLE VOICE MESSAGE
   ========================================================= */
function openChat(){ showScreen('chatScreen'); loadMessages(); }
function closeChat(){ if(unsubMessages){ unsubMessages(); unsubMessages = null; } showScreen('appScreen'); }

function loadMessages(){
  if(unsubMessages) unsubMessages();
  const box = document.getElementById('messagesBox');
  box.innerHTML = '<p class="text-center text-xs text-slate-400 py-6">Loading messages...</p>';
  unsubMessages = db.collection('messages').orderBy('createdAt','asc').limitToLast(200).onSnapshot(snap=>{
    const msgs = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderMessages(msgs);
  });
}

let globalAudio = null;
let currentPlayingBtn = null;

function renderMessages(msgs){
  const box = document.getElementById('messagesBox');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  if(!msgs.length){ box.innerHTML = '<p class="text-center text-xs text-slate-400 py-6">এখনো কোনো মেসেজ নেই। প্রথম মেসেজটি আপনিই পাঠান! 🎉</p>'; return; }

  let html = '';
  msgs.forEach(m=>{
    const mine = m.uid === fbUser.uid;
    const time = fmtTime(m.createdAt);

    let body = '';
    if(m.type === 'image'){
      body = `<img src="${esc(m.url)}" onclick="viewImage('${esc(m.url)}')" class="rounded-xl max-w-[220px] max-h-[280px] object-cover cursor-pointer">`;
    }else if(m.type === 'audio'){
      const duration = m.duration ? (m.duration / 1000).toFixed(0) : '0';
      const mins = Math.floor(duration / 60);
      const secs = duration % 60;
      const timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
      
      let waveform = '';
      for(let i=0; i<20; i++){
        const h = Math.floor(Math.random() * 12) + 4; 
        waveform += `<div class="wave-bar" style="height:${h}px; opacity: 0.8"></div>`;
      }

      body = `
        <div class="flex items-center gap-2 bg-indigo-600 text-white rounded-2xl rounded-br-sm p-2 pr-3 cursor-pointer audio-msg-container" 
             onclick="toggleAudio(this, '${esc(m.url)}')">
          <button class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center shrink-0 audio-play-btn">
            <i class="fa-solid fa-play text-sm"></i>
          </button>
          <div class="flex-1 flex items-center gap-0.5 h-6 overflow-hidden waveform">
            ${waveform}
          </div>
          <span class="text-xs font-semibold ml-1 audio-duration">${timeStr}</span>
        </div>
      `;
    }else{
      body = `<p class="whitespace-pre-wrap break-words">${esc(m.text || '')}</p>`;
    }

    html += `
      <div class="flex ${mine?'justify-end':'justify-start'} items-end gap-2 msg-in">
        ${!mine ? `<img src="${esc(avatarOf({name: m.name, photo: m.photo}))}" class="w-7 h-7 rounded-full object-cover shrink-0">` : ''}
        <div class="max-w-[75%]">
          ${!mine ? `<p class="text-[11px] font-semibold text-indigo-500 mb-0.5 ml-1">${esc(m.name||'User')}</p>` : ''}
          <div class="${mine ? '' : 'bg-white dark:bg-slate-800 rounded-2xl rounded-bl-sm px-3.5 py-2 text-sm shadow-sm'}">
            ${body}
          </div>
          <p class="text-[10px] text-slate-400 mt-0.5 ${mine?'text-right mr-1':'ml-1'}">${time}</p>
        </div>
      </div>`;
  });
  box.innerHTML = html;
  if(nearBottom) box.scrollTop = box.scrollHeight;
}

function viewImage(url){ openModal(`<img src="${esc(url)}" class="w-full rounded-xl"><button onclick="closeModal()" class="w-full mt-3 py-2.5 rounded-xl bg-slate-200 text-sm font-semibold">Close</button>`); }

function toggleAudio(container, url){
  const btnIcon = container.querySelector('.audio-play-btn i');
  const bars = container.querySelectorAll('.wave-bar');
  if(globalAudio && globalAudio.src === url && !globalAudio.paused){
    globalAudio.pause(); btnIcon.className = 'fa-solid fa-play text-sm'; bars.forEach(b => b.style.animation = 'none'); return;
  }
  if(globalAudio){ globalAudio.pause(); if(currentPlayingBtn){ currentPlayingBtn.querySelector('.audio-play-btn i').className = 'fa-solid fa-play text-sm'; currentPlayingBtn.querySelectorAll('.wave-bar').forEach(b => b.style.animation = 'none'); } }
  if(!globalAudio || globalAudio.src !== url){ globalAudio = new Audio(url); globalAudio.onended = () => { btnIcon.className = 'fa-solid fa-play text-sm'; bars.forEach(b => b.style.animation = 'none'); }; }
  globalAudio.play(); btnIcon.className = 'fa-solid fa-pause text-sm'; currentPlayingBtn = container;
  bars.forEach((b, i) => { b.style.animation = `soundwave 0.8s infinite ease-in-out`; b.style.animationDelay = `${i * 0.05}s`; });
}

/* =========================================================
   PUSH NOTIFICATION WITH MESSAGE
   ========================================================= */
async function pushMessage(payload){ 
  // ফায়ারবেসে মেসেজ সেভ
  await db.collection('messages').add({ 
    uid: fbUser.uid, 
    name: myProfile.name, 
    photo: myProfile.photo, 
    createdAt: FV.serverTimestamp(), 
    ...payload 
  });
  
  // OneSignal এ নোটিফিকেশন পাঠানো
  let bodyText = '';
  if (payload.type === 'text') bodyText = payload.text?.substring(0, 100) || 'নতুন মেসেজ';
  else if (payload.type === 'image') bodyText = '📷 একটি ছবি পাঠিয়েছে';
  else if (payload.type === 'audio') bodyText = '🎤 ভয়েস মেসেজ পাঠিয়েছে';
  
  try {
    await fetch('https://onesignal.com/api/v1/notifications', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Basic ${ONESIGNAL_REST_KEY}`
      },
      body: JSON.stringify({
        app_id: ONESIGNAL_APP_ID,
        included_segments: ['Subscribed Users'], 
        headings: { en: `Batch 2K30 - ${myProfile.name}` },
        contents: { en: bodyText },
        url: window.location.href
      })
    });
    console.log('Notification Sent ✅');
  } catch(err) {
    console.error('Notification Failed ❌', err);
  }
}

async function sendText(){
  const input = document.getElementById('msgInput'); const text = input.value.trim(); if(!text) return;
  input.value = ''; input.style.height = 'auto';
  try{ await pushMessage({type:'text', text}); }catch(e){ toast('মেসেজ পাঠানো যায়নি'); }
}
document.getElementById('sendBtn').addEventListener('click', sendText);
document.getElementById('msgInput').addEventListener('keydown', e=>{ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(); } });
document.getElementById('msgInput').addEventListener('input', e=>{ e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 96) + 'px'; });
document.getElementById('chatImageInput').addEventListener('change', async e=>{ const f = e.target.files[0]; e.target.value = ''; if(!f) return; toast('ছবি আপলোড হচ্ছে...'); try{ const url = await uploadImage(f); await pushMessage({type:'image', url}); toast('ছবি পাঠানো হয়েছে'); } catch(err){ console.error(err); toast('ছবি পাঠানো ব্যর্থ'); } });

/* =========================================================
   4) VOICE RECORDING LOGIC (Base64 for Firestore)
   ========================================================= */
let mediaRecorder = null;
let audioChunks = [];
let recStartTime = 0;
let recordTimerInterval = null;
let isRecording = false;

const normalArea = document.getElementById('normalInputArea');
const recordingArea = document.getElementById('recordingArea');
const recordTimerEl = document.getElementById('recordTimer');

document.getElementById('micBtn').addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    
    // MIME type for iOS & Android compatibility
    let options = { mimeType: 'audio/webm' };
    if (!MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType: 'audio/mp4' };

    mediaRecorder = new MediaRecorder(stream, options);
    audioChunks = [];

    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordTimerInterval);
      const duration = Date.now() - recStartTime;
      
      if(duration < 800) { toast('খুব ছোট, আবার চেষ্টা করুন'); resetRecordingUI(); return; }

      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
      toast('ভয়েস পাঠানো হচ্ছে...');
      
      // Convert Blob to Base64
      const reader = new FileReader();
      reader.readAsDataURL(blob);
      reader.onloadend = async () => {
        const base64Audio = reader.result;
        // Firestore has a 1MB limit. Approx 900,000 chars = 900KB
        if (base64Audio.length > 900000) {
          toast('ভয়েস অনেক বড়! ছোট করে রেকর্ড করুন।');
          resetRecordingUI();
          return;
        }
        
        try {
          await pushMessage({ type: 'audio', url: base64Audio, duration });
          toast('ভয়েস পাঠানো হয়েছে');
        } catch (err) {
          console.error("Firestore Error:", err);
          toast('ভয়েস পাঠানো ব্যর্থ!');
        } finally {
          resetRecordingUI();
        }
      };
    };

    mediaRecorder.start();
    isRecording = true;
    recStartTime = Date.now();
    
    normalArea.classList.add('hidden');
    normalArea.classList.remove('flex');
    recordingArea.classList.remove('hidden');
    recordingArea.classList.add('flex');
    
    recordTimerEl.textContent = '0:00';
    recordTimerInterval = setInterval(() => {
      const secs = Math.floor((Date.now() - recStartTime) / 1000);
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      recordTimerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }, 1000);

  } catch (err) {
    console.error(err);
    toast('মাইক্রোফোন অনুমতি প্রয়োজন');
  }
});

document.getElementById('cancelRecord').addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.onstop = null; 
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  clearInterval(recordTimerInterval);
  resetRecordingUI();
});

document.getElementById('sendRecord').addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
});

function resetRecordingUI() {
  isRecording = false;
  recordingArea.classList.add('hidden');
  recordingArea.classList.remove('flex');
  normalArea.classList.remove('hidden');
  normalArea.classList.add('flex');
}
</script>
